name: Tests

on: [push, pull_request]

jobs:
  broadbalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"
      - run: Rscript -e 'if (!requireNamespace("nlme", quietly = TRUE)) install.packages("nlme", repos = "https://cloud.r-project.org")'
      - run: python fetch_broadbalk.py
      - run: Rscript tests/test_analysis.R
      - run: Rscript analysis.R
      - run: Rscript plot_results.R --output runs/figures
      - run: quarto render report.qmd
